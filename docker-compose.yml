version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ecs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ecs_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_IN_MEMORY_QUEUE=false
      - CONCURRENT_WORKERS=8
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
    volumes:
      - ./storage:/app/storage
      - ./samples:/app/samples
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ecs_worker
    restart: unless-stopped
    command: celery -A backend.app.workers.celery_app worker -l info -c 8
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_IN_MEMORY_QUEUE=false
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ecs_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
